[package]
name = "deskbridge"
version = "0.1.0"
description = "Local-only keyboard and mouse sharing for Windows and macOS"
authors = ["DeskBridge contributors"]
edition = "2021"
license = "MIT"

[build-dependencies]
png = "0.17.16"
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
dirs = "6.0.0"
ring = "0.17.14"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2.11.5", default-features = false, features = ["wry"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
